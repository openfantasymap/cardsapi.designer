openapi: 3.0.3
info:
  title: CardForge API
  description: >
    Backend API for CardForge. The frontend authenticates users via GitHub PAT
    and forwards the token to this API. All GitHub repository operations
    (reading/writing files) are handled server-side.
  version: 2.0.0
  contact:
    name: CardForge

servers:
  - url: /api
    description: CardForge backend (relative)

security:
  - bearerAuth: []

paths:
  # ── Authentication ─────────────────────────────────────
  /auth/me:
    get:
      operationId: getMe
      summary: Get current user identity
      description: >
        Validates the forwarded GitHub token and returns user info.
        The backend calls GitHub's /user endpoint on the server side.
      tags: [Auth]
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Invalid or expired GitHub token

  # ── Repositories ───────────────────────────────────────
  /repos:
    get:
      operationId: listRepos
      summary: List repositories the user can push to
      description: >
        Proxies GitHub's repo listing. Returns a simplified list.
      tags: [Repos]
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [updated, created, pushed, full_name]
            default: updated
        - name: per_page
          in: query
          schema:
            type: integer
            default: 30
            maximum: 100
      responses:
        '200':
          description: List of repositories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepoSummary'

  # ── Projects ───────────────────────────────────────────
  /projects/{projectId}/save:
    post:
      operationId: saveProject
      summary: Save a CardForge project to a GitHub repo
      description: >
        Receives the full project payload. The backend generates template.json,
        data.csv, card HTML files, and JSON-LD (if TCG annotations are present),
        then commits them to the specified GitHub repo under `cardforge/{projectName}/`.
      tags: [Projects]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveProjectRequest'
      responses:
        '200':
          description: Project saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveProjectResponse'
        '400':
          description: Invalid project or missing template
        '401':
          description: GitHub token invalid

  /projects/{projectId}/load:
    get:
      operationId: loadProject
      summary: Load a CardForge project from a GitHub repo
      description: >
        Reads template.json and data.csv from the repo and reconstructs
        the CardProject object.
      tags: [Projects]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: query
          required: true
          schema:
            type: string
          description: "Full repo name (owner/repo)"
      responses:
        '200':
          description: Project loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardProject'
        '404':
          description: Project not found in repo

  # ── Export ─────────────────────────────────────────────
  /projects/{projectId}/export:
    post:
      operationId: exportProject
      summary: Export rendered cards without saving to GitHub
      description: >
        Returns a zip archive of generated HTML cards, JSON-LD,
        template.json, and data.csv — without committing to a repo.
      tags: [Projects]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportProjectRequest'
      responses:
        '200':
          description: Zip archive
          content:
            application/zip:
              schema:
                type: string
                format: binary

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        GitHub Personal Access Token forwarded by the frontend.
        The backend uses this to authenticate GitHub API calls.

  schemas:
    User:
      type: object
      properties:
        login:
          type: string
          example: octocat
        avatar_url:
          type: string
          format: uri
        name:
          type: string
          nullable: true

    RepoSummary:
      type: object
      properties:
        full_name:
          type: string
          example: octocat/my-cards
        name:
          type: string
        owner:
          type: string
        private:
          type: boolean
        default_branch:
          type: string
          example: main

    CardElementStyle:
      type: object
      properties:
        fontSize:
          type: number
        fontWeight:
          type: string
        color:
          type: string
        iconName:
          type: string
        strokeWidth:
          type: number
        svgData:
          type: string
          description: Base64 data URI of SVG
        imageUrl:
          type: string
          format: uri

    CardElement:
      type: object
      required: [id, type, tag, x, y, width, height, style]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [text, icon, image, hline, vline, svg]
        tag:
          type: string
          description: "Tag name, e.g. {{name}}"
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
        style:
          $ref: '#/components/schemas/CardElementStyle'
        tcgType:
          type: string
          description: "TCG Schema class URI (e.g. tcg:Card)"
        tcgProperty:
          type: string
          description: "TCG Schema property URI (e.g. tcg:cardName)"

    CardTemplate:
      type: object
      required: [id, name, width, height, backgroundColor, elements]
      properties:
        id:
          type: string
        name:
          type: string
        width:
          type: number
          example: 350
        height:
          type: number
          example: 490
        backgroundImage:
          type: string
          description: Base64 data URI or URL
        backgroundColor:
          type: string
          example: "hsl(220 18% 13%)"
        elements:
          type: array
          items:
            $ref: '#/components/schemas/CardElement'

    CardRow:
      type: object
      additionalProperties:
        type: string
      description: Key-value pairs matching template tag names

    CardProject:
      type: object
      required: [id, name, description, createdAt, rows]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        template:
          $ref: '#/components/schemas/CardTemplate'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/CardRow'

    SaveProjectRequest:
      type: object
      required: [repo, project]
      properties:
        repo:
          type: string
          description: "Full repo name (owner/repo)"
          example: octocat/my-cards
        branch:
          type: string
          description: Target branch (defaults to repo default)
        project:
          $ref: '#/components/schemas/CardProject'

    SaveProjectResponse:
      type: object
      properties:
        path:
          type: string
          example: cardforge/MyProject
        fileCount:
          type: integer

    ExportProjectRequest:
      type: object
      required: [project]
      properties:
        project:
          $ref: '#/components/schemas/CardProject'

openapi: 3.0.3
info:
  title: CardForge API
  description: >
    Backend API for CardForge. Authentication is handled via GitHub App
    OAuth flow (server-side). The backend manages GitHub tokens and
    interacts with GitHub on behalf of the user.
  version: 3.0.0
  contact:
    name: CardForge

servers:
  - url: /api
    description: CardForge backend (relative)

paths:
  # ── Authentication (GitHub App OAuth) ──────────────────
  /auth/github:
    get:
      operationId: initiateGitHubAuth
      summary: Initiate GitHub App OAuth flow
      description: >
        Returns a redirect URL to GitHub's authorization page.
        The frontend should redirect the user to this URL.
        The state parameter is generated server-side for CSRF protection.
      tags: [Auth]
      parameters:
        - name: return_to
          in: query
          schema:
            type: string
          description: URL to redirect back to after auth completes
      responses:
        '200':
          description: Authorization URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorization_url:
                    type: string
                    format: uri
                    description: GitHub OAuth authorization URL to redirect user to

  /auth/github/callback:
    get:
      operationId: handleGitHubCallback
      summary: Handle GitHub OAuth callback
      description: >
        Receives the authorization code from GitHub after user approves.
        Exchanges it for an access token via the GitHub App.
        Creates or updates the user session and returns a session token.
      tags: [Auth]
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Authorization code from GitHub
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: CSRF state token for validation
      responses:
        '200':
          description: Authentication successful, returns session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: Invalid or expired code/state
        '403':
          description: User denied authorization

  /auth/me:
    get:
      operationId: getMe
      summary: Get current authenticated user
      description: >
        Returns the currently authenticated user based on the session token.
        The backend resolves the GitHub identity from the stored access token.
      tags: [Auth]
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          description: Not authenticated or session expired

  /auth/logout:
    post:
      operationId: logout
      summary: Log out and destroy session
      description: >
        Invalidates the current session token and revokes the GitHub
        installation token if applicable.
      tags: [Auth]
      security:
        - sessionAuth: []
      responses:
        '204':
          description: Logged out successfully
        '401':
          description: Not authenticated

  # ── Installations ──────────────────────────────────────
  /auth/installations:
    get:
      operationId: listInstallations
      summary: List GitHub App installations for the user
      description: >
        Returns the GitHub App installations accessible to the authenticated user.
        Used to determine which organizations/accounts have the app installed.
      tags: [Auth]
      security:
        - sessionAuth: []
      responses:
        '200':
          description: List of installations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Installation'
        '401':
          description: Not authenticated

  # ── Repositories ───────────────────────────────────────
  /repos:
    get:
      operationId: listRepos
      summary: List repositories the user can push to
      description: >
        Returns repositories accessible via the GitHub App installation.
        Filtered to repos where the user has push access.
      tags: [Repos]
      security:
        - sessionAuth: []
      parameters:
        - name: installation_id
          in: query
          schema:
            type: integer
          description: Filter by specific installation
        - name: sort
          in: query
          schema:
            type: string
            enum: [updated, created, pushed, full_name]
            default: updated
        - name: per_page
          in: query
          schema:
            type: integer
            default: 30
            maximum: 100
      responses:
        '200':
          description: List of repositories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepoSummary'
        '401':
          description: Not authenticated

  # ── Projects ───────────────────────────────────────────
  /projects/{projectId}/save:
    post:
      operationId: saveProject
      summary: Save a CardForge project to a GitHub repo
      description: >
        Receives the full project payload. The backend generates template.json,
        data.csv, card HTML files, and JSON-LD (if TCG annotations are present),
        then commits them to the specified GitHub repo under `cardforge/{projectName}/`.
      tags: [Projects]
      security:
        - sessionAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveProjectRequest'
      responses:
        '200':
          description: Project saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveProjectResponse'
        '400':
          description: Invalid project or missing template
        '401':
          description: Not authenticated

  /projects/{projectId}/load:
    get:
      operationId: loadProject
      summary: Load a CardForge project from a GitHub repo
      description: >
        Reads template.json and data.csv from the repo and reconstructs
        the CardProject object.
      tags: [Projects]
      security:
        - sessionAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: query
          required: true
          schema:
            type: string
          description: "Full repo name (owner/repo)"
      responses:
        '200':
          description: Project loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardProject'
        '404':
          description: Project not found in repo

  # ── Export ─────────────────────────────────────────────
  /projects/{projectId}/export:
    post:
      operationId: exportProject
      summary: Export rendered cards without saving to GitHub
      description: >
        Returns a zip archive of generated HTML cards, JSON-LD,
        template.json, and data.csv — without committing to a repo.
      tags: [Projects]
      security:
        - sessionAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportProjectRequest'
      responses:
        '200':
          description: Zip archive
          content:
            application/zip:
              schema:
                type: string
                format: binary

components:
  securitySchemes:
    sessionAuth:
      type: http
      scheme: bearer
      description: >
        Session token returned by /auth/github/callback.
        The backend maps this to a GitHub access token internally.

  schemas:
    AuthSession:
      type: object
      properties:
        session_token:
          type: string
          description: Opaque session token for subsequent API calls
        user:
          $ref: '#/components/schemas/AuthUser'
        expires_at:
          type: string
          format: date-time

    AuthUser:
      type: object
      properties:
        login:
          type: string
          example: octocat
        avatar_url:
          type: string
          format: uri
        name:
          type: string
          nullable: true
        installations:
          type: array
          items:
            $ref: '#/components/schemas/Installation'

    Installation:
      type: object
      properties:
        id:
          type: integer
          description: GitHub App installation ID
        account:
          type: object
          properties:
            login:
              type: string
            avatar_url:
              type: string
              format: uri
            type:
              type: string
              enum: [User, Organization]
        permissions:
          type: object
          additionalProperties:
            type: string
        repository_selection:
          type: string
          enum: [all, selected]

    RepoSummary:
      type: object
      properties:
        full_name:
          type: string
          example: octocat/my-cards
        name:
          type: string
        owner:
          type: string
        private:
          type: boolean
        default_branch:
          type: string
          example: main

    CardElementStyle:
      type: object
      properties:
        fontSize:
          type: number
        fontWeight:
          type: string
        color:
          type: string
        iconName:
          type: string
        strokeWidth:
          type: number
        svgData:
          type: string
          description: Base64 data URI of SVG
        imageUrl:
          type: string
          format: uri

    CardElement:
      type: object
      required: [id, type, tag, x, y, width, height, style]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [text, icon, image, hline, vline, svg]
        tag:
          type: string
          description: "Tag name, e.g. {{name}}"
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
        style:
          $ref: '#/components/schemas/CardElementStyle'
        tcgType:
          type: string
        tcgProperty:
          type: string

    CardTemplate:
      type: object
      required: [id, name, width, height, backgroundColor, elements]
      properties:
        id:
          type: string
        name:
          type: string
        width:
          type: number
          example: 350
        height:
          type: number
          example: 490
        backgroundImage:
          type: string
        backgroundColor:
          type: string
          example: "hsl(220 18% 13%)"
        elements:
          type: array
          items:
            $ref: '#/components/schemas/CardElement'

    CardRow:
      type: object
      additionalProperties:
        type: string

    CardProject:
      type: object
      required: [id, name, description, createdAt, rows]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        template:
          $ref: '#/components/schemas/CardTemplate'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/CardRow'

    SaveProjectRequest:
      type: object
      required: [repo, project]
      properties:
        repo:
          type: string
          example: octocat/my-cards
        branch:
          type: string
        project:
          $ref: '#/components/schemas/CardProject'

    SaveProjectResponse:
      type: object
      properties:
        path:
          type: string
          example: cardforge/MyProject
        fileCount:
          type: integer

    ExportProjectRequest:
      type: object
      required: [project]
      properties:
        project:
          $ref: '#/components/schemas/CardProject'
